# MkDocs Material site for the whole repo — publishes every Markdown page as a
# searchable website on GitHub Pages.
#
#   Local preview:  uv run --group docs mkdocs serve
#                   (toolchain pinned in pyproject.toml [dependency-groups].docs + uv.lock)
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions,
#                    and widen the github-pages environment's branch policy to master)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown GitHub renders is what the site serves, and the example sources
# (.rb / .py / .sh) and their recorded .out keys are carried through as static
# files, so links to them keep working.

site_name: Ruby — Learning Library
site_description: Ruby, one idea per page, each measured beside the same idea in Python — every claim backed by a Ruby program and a Python twin that run and are checked against their recorded output in CI on Ubuntu and macOS.
site_url: https://masiarek.github.io/ruby-learning-library/
repo_url: https://github.com/masiarek/ruby-learning-library
repo_name: masiarek/ruby-learning-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# Cross-links are authored for GitHub's file-relative rendering (including links
# to a folder's README.md). Plain .html pages keep those exact semantics; pretty
# directory URLs would shift every page one level deeper and break them.
use_directory_urls: false

# A relative link's #fragment is checked against the ids on the page it points
# at; at `warn` a dead anchor fails a --strict build instead of passing at
# `info`. Links into the sibling libraries are absolute URLs and are not checked.
validation:
  links:
    anchors: warn

# MkDocs maps README.md onto index.md, so the root README and index.md collide.
# Excluding it is right rather than a workaround: its content already IS the
# homepage, inlined by index.md through pymdownx.snippets, which reads from disk
# and so is unaffected. GitHub still renders it as the repo front page.
#
# The leading slash anchors the pattern to the repo root. Without it, .gitignore
# semantics would match README.md at ANY depth and silently delete every folder's
# section landing page from the site.
exclude_docs: |
  /README.md
  __pycache__/

# Built and linkable, but kept out of the sidebar: house conventions are for
# someone about to write a page, not for a reader browsing lessons.
not_in_nav: |
  /CONTRIBUTING.md

theme:
  name: material
  icon:
    logo: material/language-ruby
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    # Every chapter open by default: the sidebar is the topic list, and a
    # reader scans it whole rather than unfolding one chapter at a time.
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Build-time fixes that would otherwise need a plugin (and a new pinned
# dependency): sidebar section labels, reading order, and the footer's prev/next
# chain.
hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid diagrams. The custom fence is what makes ```mermaid render as a
  # diagram on the site; GitHub renders the same fence natively, so one source
  # serves both surfaces. Without it the fence ships as a grey code block.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Lets index.md inline README.md, so the repo front page and the site homepage
  # share one source and cannot drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/masiarek/ruby-learning-library
